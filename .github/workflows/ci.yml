# Hermetic CI: lint + contract lint + pytest. No production secrets; no live vendors.
name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  hermetic:
    name: lint-contract-pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run hermetic CI (lint + contract lint + pytest)
        run: make ci
