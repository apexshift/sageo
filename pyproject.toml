[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sageo"
version = "0.1.1"
description = "Agents and agent skills for consistent search optimisation across SEO, AIO, and GEO outcomes."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Apex Shift" }]
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "jsonschema>=4.0",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Unique basenames under tests/skills/<pillar>/<name>/test_golden.py
addopts = ["--import-mode=importlib"]

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# Hermetic CI lint: syntax/undefined-name/unused-import class checks.
# Broader style rules can land in later hygiene tickets.
select = ["E", "F"]
ignore = ["E501"]
