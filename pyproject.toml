[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sageo"
version = "0.1.0"
description = "Agents and agent skills for consistent search optimisation across SEO, AIO, and GEO outcomes."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Apex Shift" }]
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "jsonschema>=4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
