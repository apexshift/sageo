<!DOCTYPE html>

  <title>How to reset a router</title>
</head>
<body>
  <h1>How to reset a router</h1>
  <p>Press and hold the reset button for 10 seconds until the lights flash.</p>
  <h2>Steps</h2>
  <ol>
    <li>Unplug the router for 30 seconds.</li>
    <li>Hold the reset button while powering on.</li>
    <li>Wait for the status light to turn solid.</li>
  </ol>
</body>
